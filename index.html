<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacToe Game</title>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="manifest" href="favicon_io/site.webmanifest">
<link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="theme">
    <button id="themeBtn">🌙</button>
    </div>
    <div class="menu">
        <h2>Select Mode</h2>
        <button id="friendBtn">Play with Friend!</button>
        <button id="computerBtn">Play with Computer!</button>
    </div>
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <button id="new-btn">New game!</button>
    </div>
    <main>
    <div class="game hide">
        <div class="container">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
    </div>
    </div>
    <button id="reset-btn" class="hide">Reset game!</button>
    </main>
    <div class="feedback-section">
        <h3>Enjoying the Tic Tac Toe game?</h3>
        <p>I'd love to hear your feedback!</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdfIekCE-C55Qur702fiJuTALq_uYHPRXbM5UEWAfib4uCxGw/viewform?usp=dialog" rel="noopener noreferrer" class="feedback-button">⭐ Give Feedback</a>
    </div>
</body>
<script src="app.js"></script>
</html>
